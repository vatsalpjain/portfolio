# Build, check and deploy (decisions 0007, 0008, 0009, 0010).
#  - push to main          → production (vatsaljain.pages.dev)
#  - push to other branch  → preview URL (<branch>.vatsaljain.pages.dev, noindex by Cloudflare)
#  - daily schedule        → rebuild production with fresh GitHub data
#  - manual button         → same as daily
name: Site

on:
  push:
  schedule:
    - cron: "30 1 * * *" # daily, 07:00 IST
  workflow_dispatch:

permissions:
  contents: read

env:
  # No tracking anywhere, including Astro's anonymous build telemetry (decision 0001).
  ASTRO_TELEMETRY_DISABLED: "1"

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type and content check
        run: npm run check

      - name: Formatting
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          GH_DATA_TOKEN: ${{ secrets.GH_DATA_TOKEN }}

      - name: Broken-link check
        run: npm run check:links

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 3

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (for the pinned wrangler version)
        run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Deploy
        run: npx wrangler pages deploy dist --project-name=vatsaljain --branch="$BRANCH"
        env:
          BRANCH: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
